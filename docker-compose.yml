services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8001}:8000"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${BACKUP_DIR:-./backups}:/app/backups
    environment:
      - DB_PATH=/app/data/stock_data.duckdb
      - BACKUP_DIR=/app/backups
      - PORT=8000
      - AUTO_SYNC_ON_START=false
      - AUTO_SYNC_SCHEDULED=false
      - AI_ENABLED=false
      - DUCKDB_MEMORY_LIMIT=768MB
      - DUCKDB_THREADS=2
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
